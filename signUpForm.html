<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06aa5e" />
    <meta name="msapplication-navbutton-color" content="#06aa5e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>ReWorn ™</title>
    <!-- <link rel="shortcut icon" href="./src/assets/images/favicon.png" type="image/x-icon"> -->
    <link rel="stylesheet" href="./src/styles/signForm.css" />
    <script src="./src/scripts/main.js" defer></script>
  </head>

  <body>
    <main class="card-container slideUp-animation">
      <div class="image-container">
        <h1 class="company">ReWorn <sup>&trade;</sup></h1>
        <img
          src="./src/assets/images/signUp.svg"
          class="illustration"
          alt="Sign Up"
        />
        <p class="quote">Regjistrohu sot dhe merr rroba falas...!</p>
        <a href="#" class="mobile-btm-nav">
          <img src="src/assets/images/dbl-arrow.png" alt="Arrows Up" />
        </a>
      </div>
      <form>
        <div class="form-container slideRight-animation">
          <h1 class="form-header">Regjistrohu</h1>

          <div class="input-container">
            <label for="f-name"></label>
            <input type="text" name="f-name" id="f-name" required />
            <span>Emri</span>
            <div class="error"></div>
          </div>

          <div class="input-container">
            <label for="l-name"></label>
            <input type="text" name="l-name" id="l-name" required />
            <span>Mbiemri</span>
            <div class="error"></div>
          </div>

          <div class="input-container">
            <label for="mail"> </label>
            <input type="email" name="mail" id="mail" required />
            <span>E-mail</span>
            <div class="error"></div>
          </div>

          <div class="input-container">
            <label for="phone"> </label>
            <input type="tel" name="phone" id="phone" required />
            <span>Nr. tel</span>
            <div class="error"></div>
          </div>

          <div class="input-container">
            <label for="user-password"></label>
            <input
              type="password"
              name="user-password"
              id="user-password"
              class="user-password"
              required
            />
            <span>Fjalëkalimi</span>
            <div class="error"></div>
          </div>

          <div class="input-container">
            <label for="user-password-confirm"></label>
            <input
              type="password"
              name="user-password-confirm"
              id="user-password-confirm"
              class="password-confirmation"
              required
            />
            <span>Konfirmo Fjalëkalimin</span>
            <div class="error"></div>
          </div>

          <div id="btm">
            <button type="submit" class="submit-btn">Krijo Llogarinë</button>
            <p class="btm-text">
              Keni një llogari..?
              <a href="signInForm.html" class="btm-text-highlighted">Kyqu</a>
            </p>
          </div>
        </div>
      </form>
    </main>
  </body>
</html>
