<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <link rel="shortcut icon" href="./src/assets/images/favicon.png" type="image/x-icon"> -->
    <link rel="stylesheet" href="./src/styles/signForm.css" />
    <script src="./src/scripts/forms.js" defer></script>
    <title>ReWorn ™</title>
  </head>
  <body>
    <main class="card-container slideUp-animation">
      <div class="image-container">
        <h1 class="company">ReWorn <sup>&trade;</sup></h1>
        <img
          src="./src/assets/images/signUp.svg"
          class="illustration"
          alt="Sign Up"
        />
        <p class="quote">Kyqu në ReWorn dhe merr rroba falas...!</p>
        <a href="#" class="mobile-btm-nav">
          <img src="src/assets/images/dbl-arrow.png" alt="Arrows Up" />
        </a>
      </div>
      <form>
        <div class="form-container slideRight-animation">
          <h1 class="form-header">Kyqu</h1>
          <div class="input-container">
            <label for="mail"> </label>
            <input type="email" name="mail" id="mail" required />
            <span>E-mail</span>
            <div class="error"></div>
          </div>
          <div class="input-container">
            <label for="user-password"></label>
            <input
              type="password"
              name="user-password"
              id="user-password"
              class="user-password"
              required
            />
            <span>Fjalëkalimi</span>
            <div class="error"></div>
          </div>
          <div id="btm">
            <button type="submit" class="submit-btn">Krijo Llogarinë</button>
            <p class="btm-text">
              Nuk keni një llogari..?
              <a href="signUpForm.html" class="btm-text-highlighted"
                >Regjistrohu</a
              >
            </p>
          </div>
        </div>
      </form>
    </main>
  </body>
</html>
